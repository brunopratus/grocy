<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0C0B">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grocy+">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <title>Grocy+</title>
</head>
<body>
<header>
  <button id="back" class="icon" hidden aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1 id="title">Grocy+</h1>
</header>

<main>
  <div id="ctx" class="ctx" hidden><span class="small muted">For receipt line</span><strong id="ctx-text"></strong><button id="ctx-back" type="button" class="secondary">Back to receipt</button></div>
  <!-- Login -->
  <section id="login" class="panel" hidden>
    <form id="login-form" class="card">
      <label>Companion token<input type="password" name="token" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
    </form>
  </section>

  <!-- Home -->
  <section id="home" class="panel" hidden>
    <div class="hello"><h2>Kitchen</h2><p id="home-sub">What do you want to do?</p></div>
    <div class="grid">
      <button data-go="scan" class="main"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg><span>Scan barcode<small>Packaged food</small></span></button>
      <button data-go="label"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM8 8h.01"/></svg><span>Nutrition label<small>Photo of the label</small></span></button>
      <button data-go="produce"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4-4-6-8-6-12a6 6 0 0 1 12 0c0 4-2 8-6 12zM12 3v6"/></svg><span>Market produce<small>Loose fruit & veg</small></span></button>
      <button data-go="weigh"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M5 21h14l-2-12H7zM9 6h6"/></svg><span>Weigh item<small>Update what's left</small></span></button>
      <button data-go="cook"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7zM8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4M16 3c0 2 2 2 2 4"/></svg><span>Cook recipe<small>Use ingredients</small></span></button>
      <button data-go="due"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 9v4l2 2M9 2h6"/></svg><span>Open / due<small>Use these first</small></span></button>
      <button data-go="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Week plan<small>Meals & shopping</small></span></button>
      <button data-go="report"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Weekly report<small>Food, money, waste</small></span></button>
      <button data-go="receipt" class="wide"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg><span>Shop receipt<small>Photo of the receipt: everything into stock at once</small></span></button>
    </div>
    <div id="home-due" class="card"></div>
    <p class="muted small foot"><a href="#" data-go="events">History</a> · <a href="#" id="logout">Log out</a></p>
  </section>

  <!-- Scan -->
  <section id="scan" class="panel" hidden>
    <div class="card">
      <video id="video" playsinline muted></video>
      <div class="row">
        <button id="scan-start">Start camera</button>
        <button id="scan-stop" class="secondary">Stop</button>
      </div>
      <form id="manual-code" class="row">
        <input name="code" inputmode="numeric" placeholder="or type barcode">
        <button type="submit" class="secondary">Look up</button>
      </form>
    </div>
    <div id="scan-result"></div>
    <form id="add-stock" class="card" hidden>
      <h2>Add to stock</h2>
      <input type="hidden" name="product_id">
      <div class="row">
        <label>Amount<input name="amount" type="number" step="any" min="0" value="1" required></label>
        <label>Unit<select name="unit"><option>pack</option><option>piece</option><option>g</option>
          <option>kg</option><option>ml</option><option>l</option></select></label>
      </div>
      <div class="row">
        <label>Price € (total)<input name="price_total" type="number" step="0.01" min="0"></label>
        <label>Store<select name="store" class="stores"></select></label>
      </div>
      <label>Best before<input name="best_before" type="date"></label>
      <label class="file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>Read date from photo<input id="due-photo" type="file" accept="image/*" capture="environment"></label>
      <button type="submit">Add</button>
    </form>
  </section>

  <!-- Label photo -->
  <section id="label" class="panel" hidden>
    <form id="label-form" class="card">
      <label>Product<select name="product_id" class="products"><option value="new">New product</option></select></label>
      <label>Barcode (optional)<input name="barcode" inputmode="numeric"></label>
      <label class="file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>Nutrition table<input name="img1" type="file" accept="image/*" capture="environment" required></label>
      <label class="file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>Front / net weight (optional)<input name="img2" type="file" accept="image/*" capture="environment"></label>
      <button type="submit">Read label</button>
    </form>
    <div id="label-result"></div>
  </section>

  <!-- Produce -->
  <section id="produce" class="panel" hidden>
    <form id="produce-form" class="card">
      <label>Name<input name="name" list="product-names" required placeholder="e.g. Morkos / carrots"></label>
      <div class="row">
        <label>Weight g<input name="weight_g" type="number" step="any" min="0"></label>
        <label>or count<input name="count" type="number" step="1" min="0"></label>
      </div>
      <div class="row">
        <label>Price €<input name="price_eur" type="number" step="0.01" min="0"></label>
        <label>Store<select name="store" class="stores"></select></label>
      </div>
      <button type="submit">Add produce</button>
    </form>
    <div id="produce-result"></div>
  </section>

  <!-- Weigh -->
  <section id="weigh" class="panel" hidden>
    <form id="weigh-form" class="card">
      <label>Product<select name="product_id" class="products" required></select></label>
      <label>Measured grams<input name="grams_measured" type="number" step="any" min="0" required></label>
      <label class="check"><input name="includes_container" type="checkbox"> includes the container</label>
      <label>Container g (if no tare set in Grocy)<input name="container_g" type="number" step="any" min="0"></label>
      <button type="submit">Save weight</button>
    </form>
    <div id="weigh-result"></div>
  </section>

  <!-- Cook -->
  <section id="cook" class="panel" hidden>
    <form id="cook-form" class="card">
      <label>Recipe<select name="recipe_id" class="recipes" required></select></label>
      <label>Servings<input name="servings" type="number" min="1" step="1"></label>
      <div class="row">
        <button type="button" id="cook-nutrition" class="secondary">Nutrition</button>
        <button type="submit">Cook now</button>
      </div>
    </form>
    <div id="cook-result"></div>
  </section>

  <!-- Open / due -->
  <section id="due" class="panel" hidden>
    <div class="row card">
      <label>Due within days<input id="due-days" type="number" value="3" min="0" max="60"></label>
      <button id="due-refresh" class="secondary">Refresh</button>
    </div>
    <div id="due-list"></div>
  </section>

  <!-- Week plan -->
  <section id="plan" class="panel" hidden>
    <form id="plan-form" class="card">
      <label class="file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></svg>Weekly plan (PDF / text / photo)<input name="file" type="file" accept=".pdf,.txt,.md,image/*"></label>
      <label>…or paste it<textarea name="text" rows="4"></textarea></label>
      <div class="row">
        <label>Week starts<input name="week_start" type="date"></label>
        <label>kcal / person<input name="kcal_target" type="number" min="1000" max="5000" step="50" placeholder="2000"></label>
      </div>
      <div class="row">
        <label>Budget € / week<input name="budget_eur" type="number" min="0" step="1"></label>
        <label>People<input name="people" type="number" min="1" value="2"></label>
      </div>
      <label>Preferences<input name="preferences" placeholder="e.g. no pork, quick lunches"></label>
      <label class="check"><input name="dry_run" type="checkbox" checked> Preview only (don't write to Grocy)</label>
      <button type="submit">Generate plan</button>
    </form>
    <div id="plan-result"></div>
  </section>

  <!-- Receipt -->
  <section id="receipt" class="panel" hidden>
    <form id="receipt-form" class="card">
      <label class="file"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>Photo of the whole receipt<input name="image" type="file" accept="image/*" capture="environment" required></label>
      <button type="submit">Read receipt</button>
    </form>
    <div id="receipt-result"></div>
  </section>

  <!-- Report -->
  <section id="report" class="panel" hidden>
    <form id="report-form" class="row card">
      <label>Week starting<input name="start" type="date"></label>
      <button type="submit" class="secondary">Show</button>
    </form>
    <div id="report-result"></div>
  </section>

  <!-- Events -->
  <section id="events" class="panel" hidden>
    <div id="events-list"></div>
  </section>
</main>

<datalist id="product-names"></datalist>
<div id="toast" role="status" hidden></div>
<div id="busy" hidden><div class="spinner"></div><p id="busy-text">Working…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
